[pytest]
markers =
    sem_besu: cenário que não usa a Besu (nem POST /lote): dispensa o check do túnel em 127.0.0.1:8545
    node_parado: exige o node do VendaDados (8546) PARADO; fora da suíte padrão, rodar com -m node_parado
    futuro: cenário Gherkin documentando escopo futuro/não implementado — sem step defs, não deve rodar (ver tests/features/*.feature)

# Roda tudo, exceto @futuro, por padrão (`pytest tests/` sem flag). Cenários
# @futuro não têm step defs de propósito (documentam escopo, ver CLAUDE.md
# "Roadmap futuro") — sem este filtro, `pytest tests/` quebra sempre que um
# for adicionado. Rodar com `-m futuro` (ou `-m ""`) pra ver/tentar os
# @futuro explicitamente.
addopts = -m "not futuro and not node_parado"
