# Sobe o Apache Jena Fuseki (triple store) do nó certifier.
#
# Imagem: stain/jena-fuseki. É a imagem Docker "de fato oficial" do
# ecossistema Jena — mantida pelo próprio time do Apache Jena (Stian Soiland-
# Reyes é committer do projeto) e referenciada na documentação do Jena como
# forma padrão de rodar o Fuseki em container. Ao subir, o entrypoint dela:
#   1. gera/lê ADMIN_PASSWORD para o usuário "admin" (usado no SPARQL Update
#      protegido e na REST admin API);
#   2. lê toda env var FUSEKI_DATASET_<n> e, para cada uma, cria via REST
#      admin API (`/$/datasets`) um dataset TDB persistente com aquele nome
#      — por isso FUSEKI_DATASET_1=certifier cria o dataset "certifier"
#      sozinho, sem precisar de config.ttl manual.
#
# Dataset TDB fica em /fuseki/databases/<nome> dentro do container; o volume
# nomeado "fuseki-data" mapeia esse diretório para persistir entre restarts.
#
# Porta host 3032 (diferente de coop-a=3030 e coop-b=3031) para os três
# Fusekis poderem rodar ao mesmo tempo na máquina de dev sem conflito.
services:
  fuseki:
    image: stain/jena-fuseki:latest
    container_name: certifier-fuseki
    ports:
      - "3032:3030"
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD}
      FUSEKI_DATASET_1: certifier
    volumes:
      - fuseki-data:/fuseki
    # Ver comentário equivalente em coop-a/docker-compose.yml: permite que
    # SERVICE de outro Fuseki alcance ESTE container via
    # host.docker.internal, funcionando também em Docker Engine/Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  fuseki-data:
